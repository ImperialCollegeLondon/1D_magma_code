name: MATLAB Tests

on:
  push:
    branches:
      - Haiyang_dev
  pull_request:
    branches:
      - Haiyang_dev
  workflow_dispatch:

env:
  # Create this as a GitHub Repository Secret
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Install MATLAB
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b

      # Run your test script
      - name: Run MATLAB tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('Test_cases');
            run_tests;
