name: MATLAB Tests

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MLM_LICENSE_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest

    timeout-minutes: 30	

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2025b

      - name: Run MATLAB tests
        uses: matlab-actions/run-command@v2
        with:
          command: |
            addpath('Test_cases');
            run_tests;
